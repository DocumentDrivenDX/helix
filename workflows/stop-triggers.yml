# stop_at triggers — base set (v1)
#
# `stop_at` events the HELIX skill MUST always confirm before executing,
# regardless of autonomy level. This file is the authoritative trigger list.
#
# Loaded by the skill when it engages (resolved via the skill's Catalog
# Resolution; floor: references/stop-triggers.yml); consulted before every
# state-changing action regardless of autonomy level. `tool_use_name` values
# are the generic primitives: Write/Edit = a file write or edit, Bash = a shell
# command, Read = a file read. Hosts map their own tool names onto them.
#
# Extension rule: repos extend via `stop_at_extensions:` under the `autonomy:`
# block of `.helix.yml`. The active trigger set is the union of base +
# extensions. Base triggers cannot be removed (only extended) — `stop_at` is a
# hard floor.

version: 1

triggers:
  - id: marker_edit
    matcher:
      tool_use_name: [Write, Edit]
      file_path_pattern: '(^|/)\.helix\.yml$'
    rationale: Marker is a load-bearing team decision; never edit without confirmation.

  - id: cross_methodology_edge_creation
    matcher:
      tool_use_name: [Write, Edit]
      content_must_match: 'cross_methodology:\s*true|cross_instance:\s*true'
    rationale: Cross-method coupling deserves an explicit moment.

  - id: branch_or_merge
    matcher:
      tool_use_name: Bash
      command_pattern: '^\s*(git\s+(checkout|merge|push|reset|rebase|cherry-pick)|gh\s+pr\s+(merge|create))'
    rationale: Hardly anything the skill should auto-do at the git level.

  - id: secret_read
    matcher:
      tool_use_name: [Read, Bash]
      target_pattern: '\.env(\.|$)|\.tfvars$|credentials\.json$|\.pem$|id_rsa(\.pub)?$|private_key|\.key$|secrets/'
    rationale: Even in autonomous mode, secrets are a stop.

  - id: large_diff
    matcher:
      tool_use_name: [Write, Edit]
      content_line_count_min: 500       # per-tool_use, not aggregated
    rationale: Avoid runaway autonomous edits.

  - id: apply
    matcher:
      tool_use_name: Bash
      command_pattern: '\b(tofu|terraform)\s+apply\b|\bdatabricks\s+(jobs|pipelines)\s+(run|update)\b|\bkubectl\s+(apply|delete|patch)\b'
    rationale: Production-affecting infra/deploy commands always confirm.

  - id: data_destruction
    matcher:
      tool_use_name: Bash
      command_pattern: '\b(DROP\s+(TABLE|SCHEMA|DATABASE|VIEW|CATALOG)|TRUNCATE(\s+TABLE)?|DELETE\s+FROM)\b|\brm\s+-[a-zA-Z]*r[a-zA-Z]*f|\brm\s+-[a-zA-Z]*f[a-zA-Z]*r|\b(aws\s+s3\s+(rm|rb)|gsutil\s+(-m\s+)?rm|az\s+storage\s+(blob|container)\s+delete|databricks\s+fs\s+rm)\b'
    rationale: Deleted data is gone unless a tested backup exists; a person decides.

  - id: schema_migration
    matcher:
      tool_use_name: Bash
      command_pattern: '\bALTER\s+TABLE\b|\balembic\s+(upgrade|downgrade)\b|\bprisma\s+(migrate\s+deploy|db\s+push)\b|\bflyway\s+migrate\b|\bliquibase\s+update\b|\bmanage\.py\s+migrate\b'
    rationale: Migrations change the shape of data and often cannot be reversed without loss.

  - id: external_send
    matcher:
      tool_use_name: Bash
      command_pattern: '\bgh\s+(issue|pr)\s+(comment|create|review)\b|\bgh\s+api\b.*\b(comments|issues)\b|\bhooks\.slack\.com\b|\b(sendmail|mailx?)\s'
    rationale: A message to another person cannot be recalled once it is read.

  - id: publish
    matcher:
      tool_use_name: Bash
      command_pattern: '\b(uv\s+publish|twine\s+upload|npm\s+publish|pnpm\s+publish|cargo\s+publish|gh\s+release\s+create|docker\s+push)\b'
    rationale: Published artifacts can be copied, cached, or indexed before they are withdrawn.

  - id: dependency_add
    matcher:
      tool_use_name: Bash
      command_pattern: '\b(uv\s+add|uv\s+pip\s+install|pip3?\s+install|pnpm\s+add|yarn\s+add|bun\s+add|cargo\s+add|go\s+get)\b|\bnpm\s+(install|i|add)\s+(-\S+\s+)*[^-\s]'
    rationale: A new dependency is scope the operator did not approve until they approve it (see the scope-discipline concern).
