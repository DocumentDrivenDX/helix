id: databricks-app
title: A Databricks App
detect:
  - {files: databricks.yml, contains: "^\\s+apps:", weight: 0.5}
  - {files: app.yaml, contains: "command:", weight: 0.3}
  - {files: pyproject.toml, contains: "fastapi|uvicorn|streamlit|flask", weight: 0.2}
flows: [developer, operator, user]
pages:
  - flow: operator
    id: settings
    title: Settings
    kind: reference
    task: Find every setting the deployed app reads, which targets set it, and where its value comes from.
    generated: databricks-app-settings
views: [stack, cast, deployment, journey]
watch: ["databricks.yml", "app.yaml", "config/*.toml"]
handling:
  never_publish:
    - "workspace hosts, warehouse ids, and service principal ids"
