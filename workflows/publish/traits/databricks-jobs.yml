id: databricks-jobs
title: Databricks jobs or pipelines deployed as a bundle
detect:
  - {files: "**/databricks.yml", contains: "^\\s+jobs:|^\\s+pipelines:|^include:", weight: 0.4}
  - {files: "**/resources/*.yml", contains: "^\\s+(jobs|pipelines):", weight: 0.3}
  - {files: "**/jobs/*.yml", contains: "tasks:", weight: 0.3}
  - {files: "**/notebooks/*.py", contains: "Databricks notebook source", weight: 0.2}
flows: [developer, operator, data]
pages:
  - flow: operator
    id: jobs
    title: Jobs
    kind: reference
    task: Find every job the bundle deploys, when it runs, and its tasks in order.
    generated: databricks-jobs
views: [deployment, dag]
watch: ["**/databricks.yml", "**/jobs/*.yml", "**/resources/*.yml"]
handling:
  never_publish:
    - "rows, sample values, or identifiers from the data"
    - "workspace hosts"
  patterns: ['\b(?:\d{1,3}\.){3}\d{1,3}\b']
