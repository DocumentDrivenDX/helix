# Metadata for Technology Assessment

artifact:
  name: Technology Assessment
  id: technology-assessment
  type: document
  activity: discover
  level: project
  optional: true

voice: artifact-signal

id_format:
  prefix: TA
  pattern: "TA-[0-9]{3}"
  example: TA-001
  description: |
    Sequential three-digit number. Each assessment compares a stated set of
    technologies on stated criteria. Numbers are never reused.

description: |
  A comparison of two or more technologies on stated criteria, independent of
  any one project. It rests on reusable technology briefs (component-profile
  with scope reusable) cited by pinned revision, grades each criterion per
  technology with evidence, and records where sources disagree. It carries
  findings, not a verdict: a recommendation needs a context, and that is a
  Decision Brief. Use it when the same comparison will serve more than one
  decision or client. Criteria and ratings may be kept as data in an
  `assessment:` front matter block, with criteria ids from the graph's shared
  `criteria.yml`; the tables are then generated from it.

  Scope `practice`, set in frontmatter as `ddx.scope`, is an assessment of a
  practice that no technology assessment covers, such as continuous
  integration. It rates no technology, so it has no Criteria, Technologies,
  Comparison, or Evidence section and no `assessment:` block. It keeps Scope,
  Findings (what the public record says, by reader), and Contradictions and
  Gaps, and closes with its own Sources. Where a technology assessment covers
  the subject, explain the practice in that assessment instead, so a reader
  is handed one document per subject.

output:
  location: docs/helix/00-discover/technology-assessment-TA-{number}-{subject}.md
  format: markdown
  naming: "TA-{number}-{subject}.md"
  examples:
    - TA-001-relational-databases-for-transactional-apps.md

reuse_policy: |
  Update in place until an issued document cites it. After that, a change to a
  finding is a new revision; documents that cite the assessment pin the
  revision they read. When a cited brief changes, re-read the affected
  criteria and record the date.

validation:
  pin_links:
    kinds: [informed_by, evaluates, supported_by]

  required_sections:
    - scope
    - criteria
    - technologies
    - comparison
    - findings
    - contradictions_and_gaps
    - evidence

  pattern_checks:
    - pattern: "TA-[0-9]{3}"
      expected: ">=1"
      message: Must carry a valid Technology Assessment identifier

  # An assessment of a practice rates no technology: no criteria, technology list, comparison, or evidence table.
  by_scope:
    practice:
      required_sections:
        - scope
        - findings
        - sources
      pattern_checks:
        - pattern: "TA-[0-9]{3}"
          expected: ">=1"
          message: Must carry a valid Technology Assessment identifier
        - pattern: "https?://"
          expected: ">=1"
          message: "Sources must carry at least one URL"

  quality_checks:
    - check: criteria_stated_before_comparison
      description: Criteria are named, defined, and (when a concern applies) tied to it before any technology is graded
      severity: blocking

    - check: same_criteria_every_technology
      description: Every technology is graded on every criterion, each cell citing a brief section or marked Unknown
      severity: blocking

    - check: tables_generated_from_block
      description: When the front matter carries an `assessment:` block, the Criteria and Comparison tables equal what `assessment-tables.py` makes from it, and every criterion has a finding or a stated gap for every subject
      severity: blocking

    - check: no_verdict_for_a_context
      description: The assessment states findings per criterion; it does not recommend a technology for a project, which is a Decision Brief
      severity: blocking

    - check: disagreements_recorded
      description: Where two sources conflict, both are cited in Contradictions and Gaps and the conflict is linked with `contradicts`; it is not resolved silently
      severity: blocking

    - check: briefs_pinned_at_publish
      description: At the publish tier, every cited technology brief carries the revision it was read at
      severity: blocking

prompts:
  generation: prompt.md

template:
  file: template.md

example:
  file: example.md


relationships:
  informed_by:
    - component-profile
    - concerns

  informs:
    - decision-brief
    - position-paper

tags:
  - research
  - comparison
  - evidence

version: 1.0.0
last_updated: 2026-11-06
