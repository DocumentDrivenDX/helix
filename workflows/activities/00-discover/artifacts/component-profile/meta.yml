# Metadata for Component Profile

artifact:
  name: Component Profile
  id: component-profile
  type: document
  activity: discover
  optional: true

voice: artifact-signal

description: |
  Desk research on one candidate stack component (a technology, product, or
  managed provider). It opens with what the project needs from the role and
  the capabilities the role must have, derived from the project's own
  artifacts before any candidate is read; then consolidates the public record
  on the candidate, capability by capability, with every claim cited; then
  scores the named alternatives on the same capabilities; and closes with a
  verdict and the questions the record cannot settle. Written before a
  tech-spike or ADR so the spike tests only what reading cannot settle. One
  instance per candidate; several candidates for one decision share the Need
  and Required Capabilities sections word for word.

output:
  location: docs/helix/00-discover/component-profile-[component-name].md
  format: markdown
  naming: "component-profile-[component-name].md"

validation:
  required_sections:
    - scope
    - summary
    - how_to_read_this_profile
    - need
    - required_capabilities
    - what_it_is
    - capability_alignment
    - technology_and_operations
    - pricing_and_licensing
    - competitive_landscape
    - confidence
    - open_questions
    - sources

  pattern_checks:
    - pattern: "https?://"
      expected: ">=1"
      message: "Sources must carry at least one URL"

    - pattern: "\\*\\*Verdict\\*\\*:"
      expected: ">=1"
      message: "Capability Alignment must close with a **Verdict**: by the definitions in How to Read This Profile"

    - pattern: "\\*\\*Status\\*\\*:"
      expected: ">=1"
      message: "Every required capability closes with a **Status**: line"

    - pattern: "\\*\\*Settled by\\*\\*:"
      expected: ">=1"
      message: "Every required capability closes its Settled by plan"

    - pattern: "\\*\\*Grade\\*\\*:"
      expected: ">=1"
      message: "Confidence carries a **Grade**: line"

    - pattern: "\\*\\*Searched\\*\\*:"
      expected: ">=1"
      message: "Sources records the searches behind every Not published and Not researched cell"

    - pattern: "\\| C\\d+ \\|"
      expected: ">=1"
      message: "Required Capabilities must list at least one C-numbered capability"

  quality_checks:
    - check: need_before_component
      description: Need and Required Capabilities cite project artifacts only (no numbered source appears in them); every capability names the goal it serves, the artifact it comes from, and what public evidence would settle it
      severity: blocking

    - check: claims_cite_at_the_clause
      description: Every claim cites a numbered source at the clause it supports, or is marked Not published with the search recorded, or Not researched with the sibling profile named
      severity: blocking

    - check: alignment_per_capability
      description: Every required capability has a Capability Alignment subsection with a Settled by line and a status from How to Read This Profile; the section closes with exactly one verdict by those definitions, and a design-defining Unknown makes it Undetermined
      severity: blocking

    - check: landscape_on_same_capabilities
      description: The Competitive Landscape scores every named alternative on the same required capabilities; a cell not researched says so and names the sibling profile
      severity: blocking

    - check: confidence_by_rubric
      description: The confidence grade follows the rubric (a design-defining Unknown caps it at Medium) and names which claims are corroborated, which rest on the maker alone, and which have no source
      severity: blocking

    - check: vocabularies_in_one_place
      description: Status, verdict, figure-label, cell, confidence, and source-class vocabularies are stated in How to Read This Profile, so a reader can tell what each word licenses
      severity: blocking

    - check: figures_labelled_and_dated
      description: Every figure is labelled Published (with source and date), Third-party estimate (naming who estimated), or Not published (with the search); every mutable fact carries an as-of date
      severity: blocking

    - check: no_invented_plan
      description: No owner, date, duration, or figure appears that a project artifact does not state; a scale the project has not set is written as the project's, never as a number
      severity: blocking

    - check: sources_classed_and_dated
      description: Every source carries its class, author or organisation, publication date where shown, and access date; scoped-version documentation is version-pinned
      severity: blocking

    - check: no_hands_on_claims
      description: No benchmark, prototype or integration result appears; the public record is the only evidence, and anything needing hands-on proof is an open question routed to a tech-spike
      severity: blocking

    - check: no_choice_made
      description: The profile assesses one candidate; the choice among candidates lives in an ADR that cites the profiles
      severity: warning

    - check: reviewed_by_named
      description: The Review Checklist names its reviewer, or says unreviewed
      severity: warning

prompts:
  generation: prompt.md

template:
  file: template.md

example:
  file: example.md

workflow:
  creation_order: 3.5
  review_cycles: 1
  approval_required: false
  approvers:
    - Technical Lead

relationships:
  informed_by:
    - product-vision
    - business-case
    - principles
    - concerns
    - architecture
    - current-state-inventory

  informs:
    - tech-spike
    - adr
    - architecture
    - concerns

tags:
  - discovery
  - research
  - component
  - vendor
  - evidence

version: 1.1.0
