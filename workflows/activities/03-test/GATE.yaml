# Checks name what must be true, not the toolchain that proves it. The
# adopting project supplies the concrete command for each automated check
# (its test runner, coverage, audit, and lint commands); HELIX imposes no
# technology choice.
activity: test
number: "03"

entry_requirements:
  automated:
    - check: previous_phase_complete
      activity: 02-design

    - check: file_exists
      path: docs/helix/02-design/architecture.md
      description: "Architecture from Design activity must exist"

    - check: dir_not_empty
      path: docs/helix/02-design/contracts
      description: "API contracts from Design activity must exist"

    - check: grep_absent
      pattern: "\\[TO BE DEFINED\\]"
      path: docs/helix/02-design/**/*.md
      description: "No TBD markers in design documents"

  manual:
    - "Relevant design decisions and constraints are clear"
    - "User stories have clear acceptance criteria"

exit_requirements:
  automated:
    # Test plan and documentation
    - check: file_exists
      path: docs/helix/03-test/test-plan.md
      description: "Test plan document must exist"

    - check: file_exists
      path: docs/helix/03-test/test-procedures.md
      description: "Test procedures document must exist"

    # Reuse the project's suites; no new suite per test layer is required.
    - check: tests_exist
      path: tests
      description: "Applicable new or existing tests exercise the scoped behavior"

    # CI/CD configuration
    - check: file_exists
      path: .github/workflows/test.yml
      fallback_paths:
        - .github/workflows/ci.yml
        - .gitlab-ci.yml
        - Jenkinsfile
        - .circleci/config.yml
      description: "CI/CD pipeline configuration must exist"

    # Quality checks on test files
    - check: grep_present
      pattern: "(describe|test|it|func Test|def test_)"
      path: tests/**/*
      description: "Test files contain test definitions"

    # Coverage targets defined
    - check: grep_present
      pattern: "coverage|threshold|target"
      path: docs/helix/03-test/test-plan.md
      description: "Test plan defines coverage targets"

  manual:
    - "Coverage plan identifies scoped requirements and meaningful tests"
    - "Test infrastructure verified operational"

next_activity: build
