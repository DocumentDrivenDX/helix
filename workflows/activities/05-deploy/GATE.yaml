# Checks name what must be true, not the toolchain that proves it. The
# adopting project supplies the concrete command for each automated check
# (its test runner, coverage, audit, and lint commands); HELIX imposes no
# technology choice.
activity: deploy
number: "05"

entry_requirements:
  automated:
    - check: previous_phase_complete
      activity: 04-build

    - check: tests_passing
      description: "All tests from Build activity must pass"

    - check: security_scan_clean
      severity: high
      description: "Security scan from Build activity clean"

    # The guide is a projection of the governing artifacts (ADR-015); it is current when no
    # page's sources moved since it was written and reviewed. Applies when .helix.yml declares
    # publish:; the guide mode's check (documentor check, or by hand) proves it.
    - check: guide_current
      when: ".helix.yml declares publish:"
      description: "The guide is current: no page stale, unreviewed, or missing"

  manual:
    - "Project-adopted coverage targets and performance SLAs validated where applicable"
    - "Documentation review completed (a project without publish: reviews its README and changelog by hand)"

exit_requirements:
  automated:
    # Deployment artifacts
    - check: file_exists
      path: docs/helix/05-deploy/deployment-checklist.md
      description: "Deployment checklist must exist"

    - check: file_exists
      path: docs/helix/05-deploy/monitoring-setup.md
      description: "Monitoring setup documentation must exist, including security alerting and audit signals when applicable"

    - check: file_exists
      path: docs/helix/05-deploy/runbook.md
      description: "Runbook must exist"

    - check: file_exists
      path: docs/helix/05-deploy/release-notes.md
      description: "Release notes must exist"

    # Infrastructure as code
    - check: file_exists
      path: deployment.yml
      fallback_paths:
        - docker-compose.yml
        - kubernetes/deployment.yaml
        - terraform/main.tf
        - infrastructure/main.tf
      description: "Infrastructure configuration must exist"

    # Health check endpoint or verification
    - check: grep_present
      pattern: "(health|ready|live|ping)"
      path: src/**/*
      fallback_paths:
        - lib/**/*
        - pkg/**/*
        - docs/helix/05-deploy/**/*.md
      description: "Health check endpoint documented or implemented"

    # Rollback procedures documented
    - check: grep_present
      pattern: "(rollback|revert|previous version)"
      path: docs/helix/05-deploy/runbook.md
      description: "Rollback procedures documented"

    # Monitoring configuration
    - check: grep_present
      pattern: "(alert|metric|dashboard|monitor)"
      path: docs/helix/05-deploy/monitoring-setup.md
      description: "Monitoring and alerting configured"

    # Environment configuration
    - check: file_exists
      path: .env.example
      fallback_paths:
        - config/environments/production.yml
        - docs/helix/05-deploy/environment-config.md
      description: "Environment configuration template exists"

  manual:
    - "Staging deployment verified successful"
    - "Production go/no-go decision approved"
    - "Release notes published"

next_activity: iterate
