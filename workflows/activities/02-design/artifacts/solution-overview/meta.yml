artifact:
  name: Solution Overview
  id: solution-overview
  type: document
  activity: design
voice: artifact-signal
description: Explain the overall solution to a new developer before they read detailed
  designs.
output:
  location: docs/helix/02-design/solution-overview.md
  format: markdown
  naming: solution-overview.md
validation:
  required_sections:
  - purpose_and_audience
  - system_map
  - parts_and_boundaries
  - critical_flows
  - vocabulary_and_reading_path
  - maintenance
  quality_checks:
  - check: presentation_visual_review
    description: When presentation quality is requested, apply diagram-design guidance and review rendered readability, semantic parity, exports, and stated limits
    severity: warning
  - check: evidence_and_authority
    description: Concrete source links support claims; explanatory content does not
      redefine governing decisions.
    severity: blocking
  - check: reader_task_verified
    description: Commands and paths are checked; an unfamiliar-developer trial is
      recorded or explicitly pending.
    severity: warning
prompts:
  generation: prompt.md
  review: Can an unfamiliar developer complete the stated reader task using concrete
    evidence and links? Are current/proposed state and verification limits explicit?
template:
  file: template.md
  sections:
  - purpose_and_audience: Purpose and audience
  - system_map: System map
  - parts_and_boundaries: Parts and boundaries
  - critical_flows: Critical flows
  - vocabulary_and_reading_path: Vocabulary and reading path
  - maintenance: Maintenance
examples:
- file: example.md
  description: HELIX self-hosting pilot solution overview
relationships:
  informs: []
  referenced_by: []
tags:
- onboarding
- orientation
version: 1.0.0
