id: plugin-manifests
title: Workflows packaged as plug-in manifests
detect:
  - {files: "**/plugin.toml", contains: "^\\[workflow\\]", weight: 0.6}
  - {files: "**/plugin.toml", contains: "^schema_version", weight: 0.2}
  - {files: "**/plugin.toml", contains: "^\\[evals\\]", weight: 0.2}
audiences: [user]
pages:
  - audience: user
    id: workflows
    title: Workflows
    kind: reference
    task: Find every workflow the product can run, what it does, and which practice areas it serves.
    generated: plugin-workflows
watch: ["**/plugin.toml"]
