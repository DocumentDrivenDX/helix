name: Website

on:
  push:
    branches: [main]
    paths: &website_paths
      - 'website/**'
      - 'docs/website/**'
      - 'scripts/generate-reference.py'
      - 'scripts/publish-artifacts.py'
      - 'scripts/publish-resources.py'
      - 'scripts/check-website-links.py'
      - 'scripts/helix_validate_artifact_meta.py'
      - 'tests/validate-website-generated.sh'
      - 'tests/validate-innsigle.sh'
      - 'scripts/innsigle-seal.sh'
      - 'scripts/innsigle-cli.sh'
      - '.innsigle/**'
      - 'workflows/activities/**/artifacts/**'
      - '.vale.ini'
      - '.vale/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths: *website_paths

jobs:
  website-checks:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.159.2"
      VALE_VERSION: "3.0.7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # generator drift gate diffs against committed output

      - name: Install Hugo
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Vale
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale

      - name: Install Playwright + browsers
        working-directory: website
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Lint prose (Vale)
        run: vale docs/website/content

      - name: Generator drift + coverage gate
        run: bash tests/validate-website-generated.sh

      - name: Validate artifact-type schemas
        run: uv run scripts/helix_validate_artifact_meta.py

      - name: Seal generated pages (build key)
        # Generated pages (`generated: true`) are sealed here with the CI build key, never committed;
        # curated pages carry committed claims from the human key (Innsigle ADR-004). The secret is the
        # PEM produced by `just innsigle-build-key`. Forked pull requests never receive repository
        # secrets (GitHub's fork isolation), so generated pages stay unsealed there; the gate below
        # drops to non-strict mode in that case instead of hard-failing every external contribution.
        env:
          INNSIGLE_BUILD_KEY: ${{ secrets.INNSIGLE_BUILD_KEY }}
        run: |
          if [ -z "$INNSIGLE_BUILD_KEY" ]; then
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              echo "::notice::INNSIGLE_BUILD_KEY unavailable on a forked pull request; generated pages stay unsealed for this run."
              exit 0
            fi
            echo "::error::INNSIGLE_BUILD_KEY secret is not set; run just innsigle-build-key and store the PEM as a repository secret"
            exit 1
          fi
          bash scripts/innsigle-seal.sh --role build

      - name: Build site (Hugo)
        working-directory: website
        # Build with the production base path so the link check validates the
        # real /helix/-prefixed URLs; a plain root build hides base-path bugs
        # like raw card links that bypass the baseURL.
        run: hugo --gc --minify --baseURL "https://documentdrivendx.github.io/helix/"

      - name: Innsigle seal gate (claims, key policy, rendered seals)
        # Rebuilds with hugo stderr captured so a stale-seal warning fails. Locally the gate skips
        # without Hugo or the CLI and tolerates unsealed generated pages; here every page must be
        # sealed by the right key and the build key must be endorsed.
        env:
          INNSIGLE_REQUIRED: ${{ secrets.INNSIGLE_BUILD_KEY != '' && '1' || '0' }}
        run: bash tests/validate-innsigle.sh

      - name: Check internal links + images
        run: python3 scripts/check-website-links.py

      - name: End-to-end + accessibility (Playwright + axe)
        working-directory: website
        env:
          CI: "1"  # forces a fresh server so a stale one cannot mask content drift
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report
          retention-days: 7
