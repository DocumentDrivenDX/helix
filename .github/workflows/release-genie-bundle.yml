name: Release skill bundles

# Publishes generated HELIX skill bundles as GitHub release assets on every tag
# push (v*). The Genie asset is consumed by `scripts/genie-install`, which
# prefers a pre-built bundle over building from source. The plugin package
# provides a self-contained Claude/Codex layout with generated references/
# output, without checking those generated bytes into source.
#
# It then publishes the same tag's plugin package as plugins/helix in the
# organization marketplace, DocumentDrivenDX/plugins. It pushes as the
# documentdrivendx-publisher GitHub App, installed only on that repository with
# Contents read and write. It needs the app's client ID in the variable
# PLUGINS_APP_CLIENT_ID and its private key in the secret
# PLUGINS_APP_PRIVATE_KEY.
#
# Outputs per release:
#   helix-genie-bundle-<tag>.tar.gz   # the skill bundle (helix/SKILL.md
#                                       + helix/references/...)
#   helix-plugin-package-<tag>.tar.gz # Claude/Codex plugin package
#   genie-install                     # the installer script (so users
#                                       can curl it from a stable URL)
#   DocumentDrivenDX/plugins          # a commit replacing plugins/helix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-bundles-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write      # required to attach assets to a release
  id-token: write      # OIDC identity for Sigstore signing
  attestations: write  # store the build-provenance attestation
  pull-requests: read  # required by the called Test workflow's permissions

jobs:
  # Heavy suites (validation scripts, documentor, docker install scenarios) run first;
  # nothing is published unless they pass. Evidence from PRs is deliberately ignored here.
  verify:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build-and-publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This must gate the publisher itself: an independent guard can race
      # with asset upload and leave a mismatched release published.
      - uses: astral-sh/setup-uv@v6

      - name: Validate release versions before building or publishing
        run: uv run --locked python scripts/release-version.py "$GITHUB_REF_NAME"

      - name: Set tag name
        id: tag
        run: echo "ref_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Genie bundle
        run: bash scripts/build-genie-bundle.sh

      - name: Build Claude/Codex plugin package
        run: bash scripts/build-plugin-package.sh

      - name: Verify bundle layout
        run: |
          test -f dist/genie-bundle/helix/SKILL.md
          test -d dist/genie-bundle/helix/references/activities
          test -d dist/genie-bundle/helix/references/concerns
          test -f dist/genie-bundle/helix/references/graph.yml
          test -f dist/genie-bundle/helix/references/voice.yml
          for activity in 00-discover 01-frame 02-design 03-test 04-build 05-deploy 06-iterate; do
            test -d dist/genie-bundle/helix/references/activities/$activity
          done
          test -f dist/plugin-package/helix/.claude-plugin/plugin.json
          test -f dist/plugin-package/helix/.codex-plugin/plugin.json
          test -f dist/plugin-package/helix/skills/helix/SKILL.md
          test -d dist/plugin-package/helix/skills/helix/references/activities
          test -d dist/plugin-package/helix/skills/helix/references/concerns
          test -f dist/plugin-package/helix/skills/helix/references/graph.yml
          bash tests/validate-plugin-package.sh
          file_count=$(find dist/genie-bundle/helix -type f | wc -l)
          echo "bundle: $file_count files"
          test "$file_count" -ge 200

      - name: Pack tarball
        run: |
          mkdir -p dist/release
          tar -czf dist/release/helix-genie-bundle-${{ steps.tag.outputs.ref_name }}.tar.gz \
            -C dist/genie-bundle helix
          tar -czf dist/release/helix-plugin-package-${{ steps.tag.outputs.ref_name }}.tar.gz \
            -C dist/plugin-package helix
          cp scripts/genie-install dist/release/genie-install
          ls -la dist/release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/*

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/release/helix-genie-bundle-${{ steps.tag.outputs.ref_name }}.tar.gz
            dist/release/helix-plugin-package-${{ steps.tag.outputs.ref_name }}.tar.gz
            dist/release/genie-install
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: true

  # Separate from the asset upload so that a failure here (a missing credential,
  # a race with another plugin's release) can be re-run on its own.
  publish-marketplace:
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Releases of different tags share one destination; publish one at a time.
    concurrency:
      group: publish-org-marketplace
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Require the publisher app credentials
        env:
          CLIENT_ID: ${{ vars.PLUGINS_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.PLUGINS_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::Set the PLUGINS_APP_CLIENT_ID variable and the PLUGINS_APP_PRIVATE_KEY secret."
            exit 1
          fi

      - name: Build Claude/Codex plugin package
        run: bash scripts/build-plugin-package.sh

      - name: Get a token for the organization marketplace
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.PLUGINS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGINS_APP_PRIVATE_KEY }}
          owner: DocumentDrivenDX
          repositories: plugins
          permission-contents: write

      - name: Checkout the organization marketplace
        uses: actions/checkout@v4
        with:
          repository: DocumentDrivenDX/plugins
          ref: main
          token: ${{ steps.app.outputs.token }}
          path: dist/plugins-repo

      - name: Publish plugins/helix
        working-directory: dist/plugins-repo
        run: |
          uv run --locked --project ../.. python ../../scripts/publish-plugin.py .
          git add --all plugins/helix
          if git diff --cached --quiet; then
            echo "plugins/helix is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish helix ${GITHUB_REF_NAME#v}" \
            -m "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          # Other plugins publish here too; replay on top of theirs if needed.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
