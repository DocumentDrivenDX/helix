name: Release auto-tag

# Release PRs validate all source versions before tagging. A draft UI release
# may be completed by moving its tag only across version metadata changes.
# Token-created tags need explicit publish workflow dispatches.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine tag from PR title and manifests
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TAG=$(python3 -c 'import os,re; m=re.match(r"^chore\(release\): (v\d+\.\d+\.\d+)(?:$|\s)", os.environ["PR_TITLE"]); assert m, "expected chore(release): vX.Y.Z"; print(m[1])')
          python3 scripts/release-version.py "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag or complete a draft UI release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Only a quarantined UI release may have its tag corrected, and
            # only when the entire intervening diff is version metadata.
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            OLD=$(git rev-parse "refs/tags/$TAG")
            git merge-base --is-ancestor "$TAG^{commit}" "$MERGE_SHA"
            git diff --name-only "$TAG^{commit}" "$MERGE_SHA" > /tmp/release-paths
            python3 - <<'PYCODE'
          from pathlib import Path
          import re, subprocess, os
          allowed = {'.claude-plugin/plugin.json', '.codex-plugin/plugin.json',
                     '.claude-plugin/marketplace.json', 'tools/documentor/pyproject.toml',
                     'tools/documentor/src/documentor/__init__.py', 'tools/documentor/uv.lock'}
          changed = set(Path('/tmp/release-paths').read_text().splitlines())
          guide_pages = {'tools/documentor/docs/guide/developer/' + name + '.md'
                         for name in ('architecture', 'developer-guide', 'embedding', 'cli')}
          assert changed and changed <= allowed | guide_pages, f"Release scope changed: {changed - allowed - guide_pages}"
          for path in changed & guide_pages:
              def body(ref):
                  text = subprocess.check_output(['git', 'show', ref + ':' + path], text=True)
                  return re.sub(r'^<!-- helix:source .* -->\n', '', text, flags=re.M)
              assert body(os.environ['TAG']) == body(os.environ['MERGE_SHA']), f"Guide body changed: {path}"
          PYCODE
            git tag -f -a "$TAG" -m "$PR_TITLE" "$MERGE_SHA"
            git push --force-with-lease="refs/tags/$TAG:$OLD" origin "refs/tags/$TAG"
            # Hide old assets until the publisher replaces them on this draft.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              gh release delete-asset "$TAG" "$asset" --yes
            done
          else
            git tag -a "$TAG" -m "$PR_TITLE" "$MERGE_SHA"
            git push origin "$TAG"
          fi

      - name: Start the publish workflows on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run release-genie-bundle.yml --ref "$TAG"
          gh workflow run install-smoke.yml --ref "$TAG"
          gh workflow run pages.yml --ref "$TAG"
