name: Release version guard

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to check (e.g. v0.20.0)'
        required: true

permissions:
  contents: write

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual checks must inspect the requested tag, never main.
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - name: Assert all shipped versions match the release tag
        id: check
        continue-on-error: true
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: python3 scripts/release-version.py "$TAG"

      # Never delete tags: another workflow could recreate the release against
      # main. The publisher has its own blocking validation before any upload.
      - name: Quarantine an invalid UI release
        if: steps.check.outcome == 'failure' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true

      - name: Fail when versions do not match
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Publish through the Releases UI to open a version bump PR before publication."
          exit 1
