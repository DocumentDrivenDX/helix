<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">HELIX: document discipline, runtime agency</title><desc id="desc">The team asks a runtime to load HELIX. Its catalog guides its routing skill, project scope bounds it, and the skill authors project documents that govern runtime execution.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#164BA1" stroke-width="1.8"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#087F78" stroke-width="1.8"/></marker></defs><style>text{font-family:Helvetica,Arial,sans-serif;fill:#142E4B}.muted{fill:#546B83}.mono{font-family:Menlo,monospace}</style><rect width="1280" height="720" fill="#F8FAFD"/>
