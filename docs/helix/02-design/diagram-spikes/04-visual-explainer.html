</style><main><figure><div class="stage"><svg viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">HELIX gives the runtime a document discipline</title><desc id="desc">Six entities and six relationships show how team intent becomes project documents. Use the controls to highlight each relationship.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs>

<script>
const captions=['The software team asks through an agent runtime.','The runtime loads the HELIX routing skill.','The artifact catalog guides the skill.','The project marker bounds the skill’s scope.','The skill authors and reconciles project documents.','The documents govern the runtime’s authorized execution.'];
const pairs=[['team','runtime'],['runtime','skill'],['catalog','skill'],['scope','skill'],['skill','docs'],['docs','runtime']];let active=-1;
function show(i){active=i;document.querySelectorAll('[data-edge]').forEach(g=>{const selected=+g.dataset.edge===i;g.classList.toggle('dimmed',i>=0&&!selected);g.querySelectorAll('path,text').forEach(e=>e.classList.toggle('hot',selected));g.querySelector('path').classList.toggle('pulse',selected)});document.querySelectorAll('.node').forEach(n=>{n.classList.toggle('dimmed',i>=0&&!pairs[i].includes(n.id));n.classList.toggle('node-focus',i>=0&&pairs[i].includes(n.id))});document.getElementById('explanation').textContent=i<0?'Follow the relationship between intent, guidance, and governing documents.':captions[i];document.getElementById('status').textContent=i<0?'Six relationships · current system':`${i+1} / 6 · ${captions[i]}`;document.getElementById('overview').setAttribute('aria-pressed',i<0)}
document.getElementById('overview').onclick=()=>show(-1);document.getElementById('next').onclick=()=>show((active+1)%6);document.getElementById('previous').onclick=()=>show(active<=0?5:active-1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show((active+1)%6);if(e.key==='ArrowLeft')show(active<=0?5:active-1)});
</script></html>
